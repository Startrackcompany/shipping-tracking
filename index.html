<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Track — Rastreamento de Encomenda</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.wrap{max-width:780px;margin:auto;padding:24px 16px}.brand{font-size:28px;font-weight:800;margin:8px 4px 20px}
.card{background:#fff;border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 8px 30px rgba(20,35,60,.08)}
h1{font-size:30px;margin:0 0 8px}h2{font-size:28px;margin:8px 0 22px}.muted{color:#667085}
form{display:flex;gap:10px;margin-top:20px}input{flex:1;padding:15px 16px;border:1px solid #d5dce6;border-radius:12px;font-size:16px}
button{padding:15px 20px;border:0;border-radius:12px;background:#1769e0;color:white;font-weight:700;font-size:16px}
.status{display:inline-block;padding:9px 14px;border-radius:22px;background:#e9f2ff;color:#1456a0;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.box{background:#f7f9fc;padding:16px;border-radius:14px}
.label{font-size:13px;color:#667085}.value{font-weight:700;margin-top:6px}.event{border-left:3px solid #1769e0;padding:0 0 22px 18px;margin-left:8px}
.error{color:#b42318;font-weight:600}@media(max-width:600px){form{flex-direction:column}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">Star Track</div>
<div class="card">
<h1>Rastreamento de encomenda</h1>
<div class="muted">Digite o número de rastreamento para consultar a situação da sua encomenda.</div>
<form id="form"><input id="tracking" value="ST-2026-458921" placeholder="Número de rastreamento" required><button type="submit">Rastrear encomenda</button></form>
<div id="message"></div>
</div>
<div id="shipment"></div>
</div>
<script>
const s={tracking_number:"ST-2026-458921",status:"Em trânsito",origin:"São Paulo, Brasil",destination:"Dubai, Emirados Árabes Unidos",current_location:"Alfândega de Dubai",estimated_delivery:"25 de agosto de 2026",events:[
["Chegou à alfândega de Dubai","17 de agosto de 2026 · 09:40"],
["Chegou a Dubai","16 de agosto de 2026 · 18:15"],
["Saiu da unidade de origem","14 de agosto de 2026 · 06:30"],
["Encomenda recebida","13 de agosto de 2026 · 10:20"]]};
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function show(){shipment.innerHTML=`<div class="card"><span class="status">${esc(s.status)}</span><div class="muted" style="margin-top:22px">Número de rastreamento</div><h2>${esc(s.tracking_number)}</h2><div class="grid"><div class="box"><div class="label">Origem</div><div class="value">${esc(s.origin)}</div></div><div class="box"><div class="label">Destino</div><div class="value">${esc(s.destination)}</div></div><div class="box"><div class="label">Localização atual</div><div class="value">${esc(s.current_location)}</div></div><div class="box"><div class="label">Previsão de entrega</div><div class="value">${esc(s.estimated_delivery)}</div></div></div><h2 style="margin-top:34px">Histórico de rastreamento</h2>${s.events.map(e=>`<div class="event"><b>${esc(e[0])}</b><div class="muted" style="margin-top:6px">${esc(e[1])}</div></div>`).join("")}</div>`}
form.addEventListener("submit",e=>{e.preventDefault();if(tracking.value.trim().toUpperCase()===s.tracking_number.toUpperCase()){message.innerHTML="";show()}else{shipment.innerHTML="";message.innerHTML='<p class="error">Número de rastreamento não encontrado.</p>'}});
show();
</script>
</body>
</html>
